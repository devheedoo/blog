<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>기술 블로그</title>
    <script>
      // SPA 리다이렉트 스크립트
      // 브라우저 라우팅을 위해 404 페이지에서 index.html로 리다이렉트
      // blog.heedo.dev (CloudFlare)에서 루트 경로로 호스팅되므로 0으로 설정
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
